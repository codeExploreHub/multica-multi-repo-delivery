[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multica-multi-repo-delivery"
dynamic = ["version"]
description = "Manifest-driven Multica delivery teams for one or more repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["PyYAML==6.0.2"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2"]

[project.scripts]
multica-delivery = "multica_delivery.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multica_delivery = ["templates/*"]

[tool.setuptools.data-files]
"share/multica-multi-repo-delivery/skills/multica-multi-repo-delivery" = [
  "skills/multica-multi-repo-delivery/SKILL.md",
]
"share/multica-multi-repo-delivery/skills/multica-multi-repo-delivery/agents" = [
  "skills/multica-multi-repo-delivery/agents/openai.yaml",
]
"share/multica-multi-repo-delivery/skills/multica-multi-repo-delivery/references" = [
  "skills/multica-multi-repo-delivery/references/lifecycle.md",
  "skills/multica-multi-repo-delivery/references/manifest-schema.md",
  "skills/multica-multi-repo-delivery/references/safety-boundaries.md",
  "skills/multica-multi-repo-delivery/references/troubleshooting.md",
]

[tool.setuptools.dynamic]
version = { attr = "multica_delivery.__version__" }
