name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development package
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -q
      - name: Build reproducible distributions
        env:
          SOURCE_DATE_EPOCH: "1787836800"
        shell: bash
        run: |
          python -m build --outdir dist
          python -m build --outdir dist-repeat
          python tools/normalize_sdist.py dist/*.tar.gz --epoch "$SOURCE_DATE_EPOCH"
          python tools/normalize_sdist.py dist-repeat/*.tar.gz --epoch "$SOURCE_DATE_EPOCH"
          cmp dist/*.whl dist-repeat/*.whl
          cmp dist/*.tar.gz dist-repeat/*.tar.gz
      - name: Verify installed wheel
        shell: bash
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/multica-delivery --version
          .wheel-venv/bin/python -c "from multica_delivery.cli.templates import template_path; assert template_path('framework.lock').is_file()"
      - name: Compile and inspect diff
        shell: bash
        run: |
          python -m compileall -q src tests
          git diff --check
