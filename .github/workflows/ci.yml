name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development package
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -q
      - name: Build distributions
        run: python -m build
      - name: Verify installed wheel
        shell: bash
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/multica-delivery --version
          .wheel-venv/bin/python -c "from multica_delivery.cli.templates import template_path; assert template_path('framework.lock').is_file()"
      - name: Compile and inspect diff
        shell: bash
        run: |
          python -m compileall -q src tests
          git diff --check
